[project]
name = "training-tools"
version = "0.1.0"
description = "研修で動かすスクリプト"
requires-python = ">=3.12,<3.13"
dependencies = [
    "playwright>=1.63.0",
    "pypdf>=6.20.0",
    "segno>=1.6.6",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# HTML と CSS のひな形を1つの文字列に書いているので、行の長さは見ない
"scripts/build_overview.py" = ["E501"]
"scripts/build_knowledge_map.py" = ["E501"]
