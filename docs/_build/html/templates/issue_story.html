<!DOCTYPE html><html lang="ja"><head>
    <meta charset="utf-8">
    <title>ユーザーストーリー</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../theme.css">
<script src="../docs.js" defer></script>
</head>
  <body>
<nav class="page-nav"><a href="../index.html">目次</a><a href="../README.html">全体概要</a><a href="../tags.html">タグ一覧</a></nav>
    <section class="level1" aria-labelledby="ユーザーストーリー">
      <h1 id="ユーザーストーリー">ユーザーストーリー</h1><!--
      Issue のタイトルは「S-01 タスクを追加する」のように ID と短い名前。ラベル「ストーリー」とマイルストーンを付ける。
      見本: examples/todo-app-snapshots/session-09/docs/stories.md（Issue の控え）
      -->
      <section class="level2" aria-labelledby="ストーリー">
        <h2 id="ストーリー">ストーリー</h2><!-- 「〜として、〜したい。なぜなら〜」の1文。誰が・何を・なぜ、がそろっているか -->
        <p>&lt;利用者&gt;として、&lt;したいこと&gt;したい。なぜなら&lt;理由&gt;から。</p><!-- 例: 利用者として、ブラウザでタスクを追加したい。なぜならターミナルを開かずに書き留めたいから。 -->
      </section>
      <section class="level2" aria-labelledby="受け入れ条件">
        <h2 id="受け入れ条件">受け入れ条件</h2><!--
        これが全部満たされたら完了、という条件。確かめられる形（数字・文言・境目）で書く。
        1つの条件が第11回でテスト1本以上になる。番号 (1) (2) … をテスト名にも付ける。
        例:
        - [ ] (1) タイトル「牛乳を買う」と期限 2026-11-01 で追加すると、一覧に出る
        - [ ] (2) タイトルの前後の空白は除いて保存される
        - [ ] (3) タイトルが空（空白だけを含む）なら追加されず、エラーの文言が出る
        - [ ] (4) 101文字以上なら追加されず、エラーの文言が出る
        -->
        <ul class="contains-task-list">
          <li class="task-list-item"><input type="checkbox" disabled=""> (1)</li>
          <li class="task-list-item"><input type="checkbox" disabled=""> (2)</li>
        </ul>
      </section>
      <section class="level2" aria-labelledby="見積">
        <h2 id="見積">見積</h2><!-- タスクに分けて、幅で見積もる。根拠を一言。例: 2〜4時間（CLI の add と同じ流れ。フォームは初めて） -->
        <table>
          <thead>
            <tr>
              <th>タスク</th>
              <th>見積</th>
              <th>根拠</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td></td>
              <td>〜時間</td>
              <td></td>
            </tr>
          </tbody>
        </table>
      </section>
      <section class="level2" aria-labelledby="関連">
        <h2 id="関連">関連</h2><!-- 分けたタスクの Issue、要件メモ、API設計書・DB設計書の該当箇所 -->
        <ul>
          <li></li>
        </ul>
      </section>
    </section>
  

</body></html>
