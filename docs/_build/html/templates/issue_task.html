<!DOCTYPE html><html lang="ja"><head>
    <meta charset="utf-8">
    <title>タスク</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../theme.css">
<script src="../docs.js" defer></script>
</head>
  <body>
<nav class="page-nav"><a href="../index.html">目次</a><a href="../README.html">全体概要</a><a href="../tags.html">タグ一覧</a></nav>
    <section class="level1" aria-labelledby="タスク">
      <h1 id="タスク">タスク</h1><!-- Issue のタイトルは「何をするか」が1行でわかるように。ストーリーから分けたタスクなら、関連にストーリーの Issue 番号を書く -->
      <section class="level2" aria-labelledby="目的">
        <h2 id="目的">目的</h2><!-- このタスクで何を実現したいか -->
      </section>
      <section class="level2" aria-labelledby="やること">
        <h2 id="やること">やること</h2>
        <ul class="contains-task-list">
          <li class="task-list-item"><input type="checkbox" disabled=""></li>
        </ul>
      </section>
      <section class="level2" aria-labelledby="完了条件">
        <h2 id="完了条件">完了条件</h2><!-- 何ができていれば終わりか。確かめられる形で書く（例: `uv run pytest` が通る、`uv run todo list --overdue` で期限切れだけ出る） -->
        <ul>
          <li></li>
        </ul>
      </section>
      <section class="level2" aria-labelledby="見積">
        <h2 id="見積">見積</h2><!-- 第9回以降。幅で書き、根拠を一言。例: 1〜3時間（テストは書いたことがあるが、日付の扱いが初めて） -->
        <ul>
          <li>見積: 〜時間</li>
          <li>根拠:</li>
        </ul>
      </section>
      <section class="level2" aria-labelledby="関連">
        <h2 id="関連">関連</h2><!-- 関係する Issue・PR・設計書 -->
        <ul>
          <li></li>
        </ul>
      </section>
    </section>
  

</body></html>
